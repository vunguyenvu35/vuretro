<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13">
<rect width="900" height="400" fill="#090B10"/>
<text x="24" y="34" fill="#E8EAF0" font-size="18" font-weight="700">Default controls (keyboard)</text>
<defs><g id="k"><rect width="46" height="46" rx="6" fill="#131724" stroke="#1C2130"/></g></defs>
<g font-family="JetBrains Mono,Menlo,monospace" text-anchor="middle" font-size="14">
<!-- row Q W E R -->
<g transform="translate(60,70)"><use href="#k"/><text x="23" y="22" fill="#E8EAF0">Q</text><text x="23" y="38" fill="#8B93A7" font-size="10">L</text></g>
<g transform="translate(112,70)"><use href="#k"/><text x="23" y="22" fill="#E8EAF0">W</text><text x="23" y="38" fill="#8B93A7" font-size="10">L2</text></g>
<g transform="translate(164,70)"><use href="#k"/><text x="23" y="22" fill="#E8EAF0">E</text><text x="23" y="38" fill="#8B93A7" font-size="10">R</text></g>
<g transform="translate(216,70)"><use href="#k"/><text x="23" y="22" fill="#E8EAF0">R</text><text x="23" y="38" fill="#8B93A7" font-size="10">R2</text></g>
<!-- row A S -->
<g transform="translate(72,122)"><use href="#k"/><text x="23" y="22" fill="#FFB347">A</text><text x="23" y="38" fill="#8B93A7" font-size="10">Y · C</text></g>
<g transform="translate(124,122)"><use href="#k"/><text x="23" y="22" fill="#FFB347">S</text><text x="23" y="38" fill="#8B93A7" font-size="10">X · D</text></g>
<!-- row Z X -->
<g transform="translate(84,174)"><use href="#k"/><text x="23" y="22" fill="#FFB347">Z</text><text x="23" y="38" fill="#8B93A7" font-size="10">B · A</text></g>
<g transform="translate(136,174)"><use href="#k"/><text x="23" y="22" fill="#FFB347">X</text><text x="23" y="38" fill="#8B93A7" font-size="10">A · B</text></g>
<!-- arrows -->
<g transform="translate(560,70)"><use href="#k"/><text x="23" y="30" fill="#5AD1FF" font-size="18">↑</text></g>
<g transform="translate(508,122)"><use href="#k"/><text x="23" y="30" fill="#5AD1FF" font-size="18">←</text></g>
<g transform="translate(560,122)"><use href="#k"/><text x="23" y="30" fill="#5AD1FF" font-size="18">↓</text></g>
<g transform="translate(612,122)"><use href="#k"/><text x="23" y="30" fill="#5AD1FF" font-size="18">→</text></g>
<g transform="translate(700,122)"><rect width="150" height="46" rx="6" fill="#131724" stroke="#1C2130"/><text x="75" y="22" fill="#E8EAF0">Enter / 1</text><text x="75" y="38" fill="#8B93A7" font-size="10">Start</text></g>
<g transform="translate(700,174)"><rect width="150" height="46" rx="6" fill="#131724" stroke="#1C2130"/><text x="75" y="22" fill="#E8EAF0">R-Shift / 5</text><text x="75" y="38" fill="#8B93A7" font-size="10">Select · Coin</text></g>
</g>
<g font-size="11" fill="#8B93A7"><text x="60" y="250">Amber keys: RetroPad B/A/Y/X · Neo Geo A/B/C/D (top label = RetroPad, bottom = Neo Geo)</text><text x="508" y="250">Arrows = D-pad / joystick</text></g>
<rect x="24" y="272" width="852" height="104" rx="10" fill="#0F121A" stroke="#1C2130"/>
<text x="42" y="298" fill="#FFB347" font-weight="700">Hotkeys</text>
<g font-family="JetBrains Mono,Menlo,monospace" font-size="12" fill="#E8EAF0"><text x="42" y="324">Esc  quit</text><text x="230" y="324">F5  save state</text><text x="440" y="324">F7  load state</text><text x="650" y="324">F6  change slot (1–4)</text><text x="42" y="350">F2  reset</text><text x="230" y="350">hold Tab  fast-forward ×4</text><text x="530" y="350" fill="#8B93A7" font-family="Inter,sans-serif">Gamepads auto-detected · 2nd pad = P2</text></g>
</svg>
