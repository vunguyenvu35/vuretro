<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13">
<rect width="900" height="540" fill="#090B10"/>
<text x="24" y="34" fill="#E8EAF0" font-size="18" font-weight="700">vuretro architecture — layers and 2 processes</text>

<!-- row 1: the two processes -->
<rect x="24" y="52" width="412" height="148" rx="10" fill="#0F121A" stroke="#1C2130"/>
<text x="42" y="78" fill="#FFB347" font-weight="700">vuretro app (Tauri) — process 1</text>
<g fill="#131724" stroke="#1C2130"><rect x="42" y="92" width="184" height="92" rx="8"/><rect x="234" y="92" width="184" height="92" rx="8"/></g>
<g text-anchor="middle"><text x="134" y="118" fill="#E8EAF0" font-weight="700">UI (Svelte)</text><text x="134" y="142" fill="#8B93A7">Library · Cores &amp; BIOS</text><text x="134" y="160" fill="#8B93A7">Controls · Settings</text>
<text x="326" y="118" fill="#E8EAF0" font-weight="700">src-tauri (Rust)</text><text x="326" y="142" fill="#8B93A7">commands · menu · gamepad</text><text x="326" y="160" fill="#8B93A7">wires adapters into App</text></g>

<rect x="464" y="52" width="412" height="148" rx="10" fill="#0F121A" stroke="#1C2130"/>
<text x="482" y="78" fill="#5AD1FF" font-weight="700">vuretro-runner — process 2, one per game</text>
<rect x="482" y="92" width="184" height="92" rx="8" fill="#131724" stroke="#1C2130"/>
<g text-anchor="middle"><text x="574" y="118" fill="#E8EAF0" font-weight="700">Adapters</text><text x="574" y="142" fill="#B79CFF">minifb · cpal · gilrs</text><text x="574" y="160" fill="#8B93A7">window, audio, pads, files</text></g>
<rect x="674" y="92" width="184" height="92" rx="8" fill="#131724" stroke="#FFB347"/>
<g text-anchor="middle"><text x="766" y="118" fill="#FFB347" font-weight="700">libretro core</text><text x="766" y="142" fill="#8B93A7">C, third party</text><text x="766" y="160" fill="#8B93A7">.dylib / .dll / .so</text></g>
<rect x="436.0" y="137.25" width="20.0" height="1.5" fill="#FFB347"/><path d="M454 133.5L454 142.5L462 138z" fill="#FFB347"/>
<text transform="translate(454 196) rotate(-90)" fill="#FFB347" font-size="11">spawn</text>

<!-- row 2: adapters and the session -->
<rect x="24" y="232" width="412" height="140" rx="10" fill="#0F121A" stroke="#1C2130"/>
<text x="42" y="258" fill="#FFB347" font-weight="700">vuretro-library — adapters</text>
<g fill="#8B93A7"><text x="42" y="288">JsonStore · FsCatalog · FsLocator</text><text x="42" y="308">ProcessLauncher · ZipBackup · installers</text><text x="42" y="328">ROM scan · BIOS check · DAT · cover art</text><text x="42" y="352" fill="#E8EAF0">disk, processes, network</text></g>

<rect x="464" y="232" width="412" height="140" rx="10" fill="#0F121A" stroke="#1C2130"/>
<text x="482" y="258" fill="#5AD1FF" font-weight="700">vuretro-play — one game session</text>
<g fill="#8B93A7"><text x="482" y="288">Session · ports: Screen, Emulator, Controller, Files</text><text x="482" y="308">crt · lcd · scale2x · rewind · speed · perf</text><text x="482" y="328">badge (system icon) · keys · cover scoring</text><text x="482" y="352" fill="#E8EAF0">no window, audio, pad or PNG code: tested with fakes</text></g>

<!-- row 3: the inside -->
<rect x="24" y="404" width="556" height="100" rx="10" fill="#0F121A" stroke="#FFB347"/>
<text x="42" y="430" fill="#FFB347" font-weight="700">vuretro-core — domain, use cases, ports</text>
<g fill="#8B93A7"><text x="42" y="456">systems registry · ROM detection · Settings, GameMeta</text><text x="42" y="476">service::App use cases · ports: Store, Catalog, Locator, Launcher</text><text x="42" y="496" fill="#E8EAF0">no I/O</text></g>
<rect x="608" y="404" width="268" height="100" rx="10" fill="#0F121A" stroke="#1C2130"/>
<text x="626" y="430" fill="#E8EAF0" font-weight="700">controls · settings</text>
<g fill="#8B93A7"><text x="626" y="456">config files shared by app and runner</text><text x="626" y="476">leaf crates</text></g>

<!-- depends-on arrows -->
<rect x="229.25" y="200.0" width="1.5" height="24.0" fill="#FFB347"/><path d="M225.5 222L234.5 222L230 230z" fill="#FFB347"/><rect x="669.25" y="200.0" width="1.5" height="24.0" fill="#FFB347"/><path d="M665.5 222L674.5 222L670 230z" fill="#FFB347"/><rect x="229.25" y="372.0" width="1.5" height="24.0" fill="#FFB347"/><path d="M225.5 394L234.5 394L230 402z" fill="#FFB347"/><rect x="519.25" y="372.0" width="1.5" height="24.0" fill="#FFB347"/><path d="M515.5 394L524.5 394L520 402z" fill="#FFB347"/><rect x="580.0" y="453.25" width="20.0" height="1.5" fill="#FFB347"/><path d="M598 449.5L598 458.5L606 454z" fill="#FFB347"/>
<text x="24" y="526" fill="#8B93A7" font-size="12">Arrows mean "depends on". Dependencies point inward only; crates/core/tests/architecture.rs fails the build if that breaks.</text>
</svg>
