[workspace]
resolver = "2"
members = ["crates/libretro-sys", "crates/core", "crates/runner", "crates/library", "crates/test-core", "crates/controls", "crates/settings"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
minifb = { path = "vendor/minifb" }
