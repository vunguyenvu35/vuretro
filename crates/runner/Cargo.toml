[package]
name = "vuretro-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "vuretro game runner: loads a libretro core and plays one game"

[[bin]]
name = "vuretro-runner"
path = "src/main.rs"

[dependencies]
libretro-sys = { path = "../libretro-sys" }
vuretro-controls = { path = "../controls" }
vuretro-core = { path = "../core" }
vuretro-play = { path = "../play" }
vuretro-library = { path = "../library" }
vuretro-settings = { path = "../settings" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
libloading = "0.8"
minifb = "0.27"
cpal = "0.15"
gilrs = "0.10"
vuretro-procon = { path = "../procon" }
clap = { version = "4.4", features = ["derive"] }
png = "0.17"
serde_json = "1"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
glow = "0.18.0"
rtrb = "0.4.1"

[dev-dependencies]
tempfile = "3"

# native menus: only where there is a menu bar to put them in (on Linux muda needs GTK)
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
muda = "0.21.2"
