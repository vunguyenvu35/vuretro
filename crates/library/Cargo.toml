[package]
name = "vuretro-library"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Adapters for vuretro-core ports: ROM scanning, BIOS files, storage, processes"

[[bin]]
name = "vuretro-scan"
path = "src/bin/scan.rs"

[[bin]]
name = "vuretro-bios-check"
path = "src/bin/bios_check.rs"

[[bin]]
name = "vuretro-install-road-rash"
path = "src/bin/install_road_rash.rs"

[dependencies]
vuretro-core = { path = "../core" }
log.workspace = true
vuretro-controls = { path = "../controls" }
vuretro-settings = { path = "../settings" }
directories = "5"
anyhow.workspace = true
walkdir = "2"
md5 = "0.7"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
crc32fast = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["util"] }
unrar = "0.5.8"

[dev-dependencies]
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["util", "compress"] }
tempfile = "3"
