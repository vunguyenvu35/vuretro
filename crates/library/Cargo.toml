[package]
name = "vuretro-library"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ROM scanning, system detection and BIOS checks for vuretro"

[[bin]]
name = "vuretro-scan"
path = "src/bin/scan.rs"

[dependencies]
anyhow.workspace = true
walkdir = "2"
md5 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
