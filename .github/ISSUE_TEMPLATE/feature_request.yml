name: Feature request
description: Suggest something Vuretro should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation first, then the feature. Which frontend do you use today for this?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Vuretro to do
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS, Windows, Linux, All]
